default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: pdm run ruff format
        language: system
        types: [python]

      - id: conventional-commit
        name: conventional commit message
        entry: pdm run cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
