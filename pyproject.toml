[project]
name = "TagTree"
version = "1.0.3"
description = "A Tag Dom Generator module"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thiago S C Pereira", email = "strovsk@outlook.com" }]
keywords = ["tag", "tree", "dom", "generator", "html", "markup", "xml", "tags", "xhtml", "xcell", "drawio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Strovsk/pytagtree"
Source = "https://github.com/Strovsk/pytagtree"
"Bug Reports" = "https://github.com/Strovsk/pytagtree/issues"

[build-system]
requires = ["pdm-backend>=2.4"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "src"

[tool.pdm.scripts]
test = { cmd = "python -m unittest discover -s . -p *_test.py -v", working_dir = "tests" }
