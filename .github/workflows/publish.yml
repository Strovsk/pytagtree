name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # criar o GitHub Release
      id-token: write # trusted publishing (OIDC), sem token salvo no repo
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"
          cache: true

      - name: Check tag matches version
        run: |
          VERSION=$(pdm show --version)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME não bate com a versão $VERSION do pyproject.toml"
            exit 1
          fi

      - name: Install
        run: pdm install

      - name: Test
        run: pdm run test

      - name: Build and publish
        run: pdm publish

      - name: Release notes
        run: pdm run cz changelog "$GITHUB_REF_NAME" --dry-run > RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
